name: NCOM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f ARCHITECTURE.md
          test -f DEV-DIARY.md
          test -f .coderabbit.yaml
          test -f desktop/ncom_desktop.py
          test -f core/ncom_server.py
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f ios/project.yml
          test -f ios/NCOMApp/NCOMApp.swift
          test -d mcp
          test -d skills
      - name: Compile Python clients
        run: python -m py_compile desktop/ncom_desktop.py core/ncom_server.py
      - name: Run core tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pytest
          cd core
          PYTHONPATH=. python -m pytest -q
