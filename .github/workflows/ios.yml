name: NCOM iOS — Build, Run & Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project NCOMAI.xcodeproj \
            -scheme NCOMAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | sed -nE 's/^    (iPhone[^()]*) \(([A-F0-9-]+)\) \(.*$/\2/p' | head -n 1)
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Install app
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'NCOMAI.app' -print -quit)
          test -d "$APP"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP"

      - name: Launch app
        run: |
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" com.pfn000.NCOMAI
          sleep 3

      - name: Capture simulator screenshot
        run: |
          mkdir -p artifacts
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot artifacts/ncom-ios-simulator.png

      - name: Collect app bundle
        working-directory: ios
        run: |
          mkdir -p ../artifacts/app
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'NCOMAI.app' -print -quit)
          cp -R "$APP" ../artifacts/app/NCOMAI.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: NCOMAI-iOS-app
          path: artifacts/app/NCOMAI.app

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: NCOMAI-iOS-screenshot
          path: artifacts/ncom-ios-simulator.png
