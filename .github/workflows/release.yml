name: NCOM Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude=.git --exclude=dist -czf dist/ncom-ai-source-${GITHUB_SHA}.tar.gz .
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
