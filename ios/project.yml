name: NCOMAI
options:
  bundleIdPrefix: com.ncom
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  NCOMAI:
    type: application
    platform: iOS
    sources:
      - path: NCOMApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ai
        INFOPLIST_KEY_CFBundleDisplayName: NCOM AI
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NCOM uses your local network to connect to an optional NCOM desktop runtime.
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
