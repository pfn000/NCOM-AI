name: NCOMAI
options:
  bundleIdPrefix: com.ncom
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
packages:
  LlamaSwift:
    github: mattt/llama.swift
    exactVersion: 2.10331.0
targets:
  NCOMAI:
    type: application
    platform: iOS
    sources:
      - path: NCOMApp
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ai
        SWIFT_VERSION: '6.0'
        INFOPLIST_KEY_CFBundleDisplayName: NCOM AI
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NCOM uses your local network to connect to an optional NCOM desktop runtime.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: NCOM uses Bluetooth to discover and connect to your authorized NCOM devices.
        INFOPLIST_KEY_NFCReaderUsageDescription: NCOM uses NFC to identify supported tags and authorized accessories.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: NCOM uses the microphone for its optional acoustic AI link.
        INFOPLIST_KEY_NearbyInteractionUsageDescription: NCOM uses Nearby Interaction to measure distance and direction to your authorized NCOM devices.
        INFOPLIST_KEY_MICROSOFT_CLIENT_ID: CONFIGURE_IN_PRIVATE_BUILD
        INFOPLIST_KEY_UIBackgroundModes: processing
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: com.ncom.ai.program-worker
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
    infoProperties:
      CFBundleURLTypes:
        - CFBundleTypeRole: Editor
          CFBundleURLSchemes:
            - com.ncom.ai
      NSAppTransportSecurity:
        NSAllowsLocalNetworking: true
  NCOMAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NCOMAppUITests
    dependencies:
      - target: NCOMAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ai.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NCOMAI:
    build:
      targets:
        NCOMAI: all
        NCOMAIUITests: [test]
    test:
      targets:
        - target: NCOMAIUITests
